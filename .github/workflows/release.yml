name: Release ReSync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Adapt gradle.properties for CI
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          sed -i 's|-Djava.io.tmpdir=[^ ]*||g' gradle.properties

      - name: Set Version & Tag
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"
          TAG_NAME="v1.0.${{ github.run_number }}"
          
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Building ReSync ${TAG_NAME} (versionCode: ${VERSION_CODE}, versionName: ${VERSION_NAME})"

      - name: Generate Changelog
        run: |
          python3 - << 'EOF'
          import subprocess
          import re
          import json
          import os

          prev_tag = ""
          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0"],
                  stderr=subprocess.DEVNULL
              ).decode().strip()
          except Exception:
              pass

          if prev_tag:
              print(f"Commits desde a tag {prev_tag}:")
              cmd = ["git", "log", "--pretty=format:%s", f"{prev_tag}..HEAD"]
          else:
              print("Primeira release automática. Buscando últimos commits:")
              cmd = ["git", "log", "-n", "15", "--pretty=format:%s"]

          raw_commits = subprocess.check_output(cmd).decode().splitlines()

          # Ignora commits de merge e vazios
          commits = [c.strip() for c in raw_commits if c.strip() and not re.match(r'(?i)^merge\b', c.strip())]

          feat_pattern = re.compile(r'^(?:feat|novo)\s*:\s*(.*)', re.IGNORECASE)
          fix_pattern = re.compile(r'^(?:fix|perf|melhoria|corre[cç][aã]o)\s*:\s*(.*)', re.IGNORECASE)

          has_any_prefix = any(feat_pattern.match(c) or fix_pattern.match(c) for c in commits)

          functions = []
          fixes = []

          if not has_any_prefix:
              fixes = commits[:]
          else:
              for c in commits:
                  m_feat = feat_pattern.match(c)
                  if m_feat:
                      functions.append(m_feat.group(1).strip())
                      continue
                  m_fix = fix_pattern.match(c)
                  if m_fix:
                      fixes.append(m_fix.group(1).strip())
                      continue
                  cleaned = re.sub(r'^[a-zA-Z0-9_\-]+:\s*', '', c).strip()
                  fixes.append(cleaned if cleaned else c)

          if not functions and not fixes:
              fixes.append("Atualizações e melhorias gerais")

          changelog_data = {
              "functions": functions,
              "fixes": fixes
          }

          with open("changelog.json", "w", encoding="utf-8") as f:
              json.dump(changelog_data, f, ensure_ascii=False, indent=2)

          notes_lines = []
          if functions:
              notes_lines.append("### Função")
              for item in functions:
                  notes_lines.append(f"- {item}")
              notes_lines.append("")

          if fixes:
              notes_lines.append("### Otimização e reparo")
              for item in fixes:
                  notes_lines.append(f"- {item}")
              notes_lines.append("")

          notes_content = "\n".join(notes_lines).strip() + "\n"
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes_content)

          print("=== release_notes.md ===")
          print(notes_content)
          EOF

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/resync-release.jks

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: /tmp/resync-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
           bash ./gradlew assembleRelease --no-daemon

      - name: Prepare Artifacts & Checksums
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Erro: APK de release não foi gerado em $APK_SRC"
            exit 1
          fi
          
          export APK_DEST="ReSync-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          
          # Calcula SHA-256 e gera arquivo .sha256 com hash puro
          export SHA256_HASH=$(sha256sum "$APK_DEST" | awk '{print $1}')
          echo "$SHA256_HASH" > "${APK_DEST}.sha256"
          
          export APK_SIZE=$(stat -c%s "$APK_DEST")
          
          echo "SHA256: $SHA256_HASH"
          echo "Size: $APK_SIZE bytes"
          
          # Gera o version.json estruturado com functions e fixes
          python3 - << 'EOF'
          import json
          import os

          with open("changelog.json", "r", encoding="utf-8") as f:
              changelog = json.load(f)

          with open("release_notes.md", "r", encoding="utf-8") as f:
              release_notes = f.read()

          version_data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "tag": os.environ["TAG_NAME"],
              "apkName": os.environ["APK_DEST"],
              "apkSize": int(os.environ["APK_SIZE"]),
              "sha256": os.environ["SHA256_HASH"],
              "releaseNotes": release_notes,
              "functions": changelog.get("functions", []),
              "fixes": changelog.get("fixes", [])
          }

          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(version_data, f, ensure_ascii=False, indent=2)
          EOF
            
          echo "=== version.json ==="
          cat version.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" \
            "ReSync-${TAG_NAME}.apk" \
            "ReSync-${TAG_NAME}.apk.sha256" \
            "version.json" \
            --title "ReSync ${TAG_NAME}" \
            --notes-file release_notes.md

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -f /tmp/resync-release.jks

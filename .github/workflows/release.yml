name: Release ReSync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Adapt gradle.properties for CI
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          sed -i 's|-Djava.io.tmpdir=[^ ]*||g' gradle.properties

      - name: Set Version & Tag
        run: |
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="1.0.${{ github.run_number }}"
          TAG_NAME="v1.0.${{ github.run_number }}"
          
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Building ReSync ${TAG_NAME} (versionCode: ${VERSION_CODE}, versionName: ${VERSION_NAME})"

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            echo "Primeira release automática. Gerando histórico de commits recentes."
            CHANGELOG=$(git log -n 15 --pretty=format:"* %s (%h)")
          else
            echo "Commits desde a tag ${PREV_TAG}:"
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" "${PREV_TAG}..HEAD")
          fi
          
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="* Atualização e melhorias do ReSync ${TAG_NAME}"
          fi
          
          echo "$CHANGELOG" > release_notes.md
          cat release_notes.md

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/resync-release.jks

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: /tmp/resync-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
           bash ./gradlew assembleRelease --no-daemon

      - name: Prepare Artifacts & Checksums
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Erro: APK de release não foi gerado em $APK_SRC"
            exit 1
          fi
          
          APK_DEST="ReSync-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          
          # Calcula SHA-256 e gera arquivo .sha256 com hash puro
          SHA256_HASH=$(sha256sum "$APK_DEST" | awk '{print $1}')
          echo "$SHA256_HASH" > "${APK_DEST}.sha256"
          
          APK_SIZE=$(stat -c%s "$APK_DEST")
          
          echo "SHA256: $SHA256_HASH"
          echo "Size: $APK_SIZE bytes"
          
          # Gera o version.json estruturado
          jq -n \
            --arg vc "$VERSION_CODE" \
            --arg vn "$VERSION_NAME" \
            --arg tag "$TAG_NAME" \
            --arg name "$APK_DEST" \
            --arg size "$APK_SIZE" \
            --arg sha "$SHA256_HASH" \
            --arg notes "$(<release_notes.md)" \
            '{
              versionCode: ($vc | tonumber),
              versionName: $vn,
              tag: $tag,
              apkName: $name,
              apkSize: ($size | tonumber),
              sha256: $sha,
              releaseNotes: $notes
            }' > version.json
            
          echo "=== version.json ==="
          cat version.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG_NAME" \
            "ReSync-${TAG_NAME}.apk" \
            "ReSync-${TAG_NAME}.apk.sha256" \
            "version.json" \
            --title "ReSync ${TAG_NAME}" \
            --notes-file release_notes.md

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -f /tmp/resync-release.jks

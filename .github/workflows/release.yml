name: Release ReSync

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Adapt gradle.properties for CI
        run: |
          sed -i '/aapt2FromMavenOverride/d' gradle.properties
          sed -i 's|-Djava.io.tmpdir=[^ ]*||g' gradle.properties

      - name: Set Version & Tag
        run: |
          if [ -f "version.properties" ]; then
            V_CODE=$(grep "versionCode=" version.properties | cut -d'=' -f2 | tr -d '[:space:]')
            V_NAME=$(grep "versionName=" version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          fi
          VERSION_CODE="${V_CODE:-${{ github.run_number }}}"
          VERSION_NAME="${V_NAME:-1.0.${{ github.run_number }}}"
          TAG_NAME="v${VERSION_NAME}"
          
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_ENV
          echo "Building ReSync ${TAG_NAME} (versionCode: ${VERSION_CODE}, versionName: ${VERSION_NAME})"

      - name: Generate Changelog
        run: |
          python3 - << 'EOF'
          import subprocess
          import re
          import json
          import os

          # Preserva release_notes.md pré-definido se existir no repositório
          if os.path.exists("release_notes.md") and os.path.getsize("release_notes.md") > 20:
              print("release_notes.md pré-definido encontrado no repositório. Preservando.")
              if not os.path.exists("changelog.json"):
                  functions = []
                  fixes = []
                  if os.path.exists("version.json"):
                      try:
                          with open("version.json", "r", encoding="utf-8") as vj:
                              vj_data = json.load(vj)
                              functions = vj_data.get("functions", [])
                              fixes = vj_data.get("fixes", [])
                      except Exception:
                          pass
                  with open("changelog.json", "w", encoding="utf-8") as f:
                      json.dump({"functions": functions, "fixes": fixes}, f, ensure_ascii=False, indent=2)
              exit(0)

          prev_tag = ""
          try:
              prev_tag = subprocess.check_output(
                  ["git", "describe", "--tags", "--abbrev=0"],
                  stderr=subprocess.DEVNULL
              ).decode().strip()
          except Exception:
              pass

          if prev_tag:
              print(f"Commits desde a tag {prev_tag}:")
              cmd = ["git", "log", "--pretty=format:%s", f"{prev_tag}..HEAD"]
          else:
              print("Primeira release automática. Buscando últimos commits:")
              cmd = ["git", "log", "-n", "15", "--pretty=format:%s"]

          raw_commits = subprocess.check_output(cmd).decode().splitlines()

          # Ignora commits de merge e vazios
          commits = [c.strip() for c in raw_commits if c.strip() and not re.match(r'(?i)^merge\b', c.strip())]

          feat_pattern = re.compile(r'^(?:feat|novo)\s*:\s*(.*)', re.IGNORECASE)
          fix_pattern = re.compile(r'^(?:fix|perf|melhoria|corre[cç][aã]o)\s*:\s*(.*)', re.IGNORECASE)

          has_any_prefix = any(feat_pattern.match(c) or fix_pattern.match(c) for c in commits)

          functions = []
          fixes = []

          if not has_any_prefix:
              fixes = commits[:]
          else:
              for c in commits:
                  m_feat = feat_pattern.match(c)
                  if m_feat:
                      functions.append(m_feat.group(1).strip())
                      continue
                  m_fix = fix_pattern.match(c)
                  if m_fix:
                      fixes.append(m_fix.group(1).strip())
                      continue
                  cleaned = re.sub(r'^[a-zA-Z0-9_\-]+:\s*', '', c).strip()
                  fixes.append(cleaned if cleaned else c)

          if not functions and not fixes:
              fixes.append("Atualizações e melhorias gerais")

          changelog_data = {
              "functions": functions,
              "fixes": fixes
          }

          with open("changelog.json", "w", encoding="utf-8") as f:
              json.dump(changelog_data, f, ensure_ascii=False, indent=2)

          notes_lines = []
          if functions:
              notes_lines.append("### Função")
              for item in functions:
                  notes_lines.append(f"- {item}")
              notes_lines.append("")

          if fixes:
              notes_lines.append("### Otimização e reparo")
              for item in fixes:
                  notes_lines.append(f"- {item}")
              notes_lines.append("")

          notes_content = "\n".join(notes_lines).strip() + "\n"
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write(notes_content)

          print("=== release_notes.md ===")
          print(notes_content)
          EOF

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > /tmp/resync-release.jks

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: /tmp/resync-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: |
           bash ./gradlew assembleRelease --no-daemon

      - name: Prepare Artifacts & Checksums
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "Erro: APK de release não foi gerado em $APK_SRC"
            exit 1
          fi
          
          export APK_DEST="ReSync-${TAG_NAME}.apk"
          cp "$APK_SRC" "$APK_DEST"
          
          # Calcula SHA-256 e gera arquivo .sha256 com hash puro
          export SHA256_HASH=$(sha256sum "$APK_DEST" | awk '{print $1}')
          echo "$SHA256_HASH" > "${APK_DEST}.sha256"
          
          export APK_SIZE=$(stat -c%s "$APK_DEST")
          
          echo "SHA256: $SHA256_HASH"
          echo "Size: $APK_SIZE bytes"
          
          # Gera o version.json estruturado com functions e fixes
          python3 - << 'EOF'
          import json
          import os

          existing_data = {}
          if os.path.exists("version.json"):
              try:
                  with open("version.json", "r", encoding="utf-8") as f:
                      existing_data = json.load(f)
              except Exception:
                  pass

          changelog = {}
          if os.path.exists("changelog.json"):
              try:
                  with open("changelog.json", "r", encoding="utf-8") as f:
                      changelog = json.load(f)
              except Exception:
                  pass

          release_notes = ""
          if os.path.exists("release_notes.md"):
              with open("release_notes.md", "r", encoding="utf-8") as f:
                  release_notes = f.read()

          version_data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "tag": os.environ["TAG_NAME"],
              "apkName": os.environ["APK_DEST"],
              "apkSize": int(os.environ["APK_SIZE"]),
              "sha256": os.environ["SHA256_HASH"],
              "releaseNotes": release_notes if release_notes else existing_data.get("releaseNotes", ""),
              "functions": existing_data.get("functions") or changelog.get("functions", []),
              "fixes": existing_data.get("fixes") or changelog.get("fixes", [])
          }

          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(version_data, f, ensure_ascii=False, indent=2)
          EOF
            
          echo "=== version.json ==="
          cat version.json

      - name: Upload APK and Checksums to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReSync-${{ env.TAG_NAME }}-release
          path: |
            ReSync-${{ env.TAG_NAME }}.apk
            ReSync-${{ env.TAG_NAME }}.apk.sha256
            version.json
          retention-days: 7

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1) Exclui release existente apenas uma vez se já existir
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME já existente encontrada. Excluindo antes de recriar..."
            gh release delete "$TAG_NAME" --yes || true
          fi

          # 2) Garante que release_notes.md seja UTF-8 válido e truncado em tamanho seguro (<= 60 KB)
          if [ ! -f "release_notes.md" ] || [ ! -s "release_notes.md" ]; then
            echo "ReSync ${TAG_NAME}" > release_notes.md
          else
            python3 - << 'EOF'
          import os
          p = "release_notes.md"
          if os.path.exists(p):
              with open(p, "rb") as f:
                  raw = f.read()
              text = raw.decode("utf-8", errors="replace")
              encoded = text.encode("utf-8")
              if len(encoded) > 60000:
                  print(f"Truncando release_notes.md de {len(encoded)} bytes para 60 KB...")
                  encoded = encoded[:60000].decode("utf-8", errors="ignore").encode("utf-8")
              with open(p, "wb") as f:
                  f.write(encoded)
          EOF
          fi

          # 3) Criação da release sem arquivos com retry (até 3 tentativas)
          MAX_ATTEMPTS=3
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Tentativa $i de $MAX_ATTEMPTS para criar a release $TAG_NAME no GitHub..."
            if gh release create "$TAG_NAME" \
              --title "ReSync ${TAG_NAME}" \
              --notes-file "release_notes.md"; then
              echo "Release $TAG_NAME criada com sucesso!"
              break
            fi

            if [ $i -lt $MAX_ATTEMPTS ]; then
              echo "Aviso: Falha ao criar a release (possível erro HTTP 5xx/502). Aguardando 15s antes da tentativa $((i + 1))..."
              sleep 15
            else
              echo "Erro: Falha persistente ao criar a release após $MAX_ATTEMPTS tentativas."
              GH_DEBUG=api gh release view "$TAG_NAME" || true
              exit 1
            fi
          done

      - name: Upload Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_FILES=(
            "ReSync-${TAG_NAME}.apk"
            "ReSync-${TAG_NAME}.apk.sha256"
            "version.json"
          )

          DELAYS=(15 30 45)
          MAX_ATTEMPTS=4
          for i in $(seq 1 $MAX_ATTEMPTS); do
            echo "Tentativa $i de $MAX_ATTEMPTS para enviar arquivos para a release $TAG_NAME..."
            if gh release upload "$TAG_NAME" "${RELEASE_FILES[@]}" --clobber; then
              echo "Todos os arquivos foram enviados com sucesso para a release $TAG_NAME!"
              break
            fi

            if [ $i -lt $MAX_ATTEMPTS ]; then
              DELAY=${DELAYS[$((i - 1))]}
              echo "Aviso: Falha no upload dos arquivos (possível erro HTTP 5xx/502). Aguardando ${DELAY}s antes da tentativa $((i + 1))..."
              sleep "$DELAY"
            else
              echo "Erro: Falha persistente no upload após $MAX_ATTEMPTS tentativas. Executando com GH_DEBUG=api para diagnóstico detalhado:"
              GH_DEBUG=api gh release upload "$TAG_NAME" "${RELEASE_FILES[@]}" --clobber || true
              exit 1
            fi
          done

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -f /tmp/resync-release.jks
